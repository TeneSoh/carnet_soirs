{% extends 'contact/layout/base.html' %}

{% block content %}
<div class="max-w-xl mx-auto bg-white p-6 rounded shadow">

    <h1 class="text-2xl font-bold mb-6">
        Enregistrer un nouveau contact
    </h1>

    <!-- MESSAGE DE SUCCÈS -->
    {% if messages %}
        {% for message in messages %}
            <div class="bg-green-100 text-green-700 p-3 rounded mb-4">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <!-- FORMULAIRE CONTACT -->
    <form method="post" class="space-y-4">
        {% csrf_token %}

        <div>
            <label class="block text-sm font-medium">Nom</label>
            <input type="text" name="name" required
                   class="w-full border rounded p-2">
        </div>

        <div>
            <label class="block text-sm font-medium">Prénom</label>
            <input type="text" name="surname" required
                   class="w-full border rounded p-2">
        </div>

        <div>
            <label class="block text-sm font-medium">Email</label>
            <input type="email" name="email" required
                   class="w-full border rounded p-2">
        </div>

        <div>
            <label class="block text-sm font-medium">Numéro de téléphone</label>
            <input type="number" name="tel" required
                   class="w-full border rounded p-2">
        </div>

        <div>
            <label class="block text-sm font-medium">Pays</label>
            <input type="text" name="country" required
                   class="w-full border rounded p-2">
        </div>

        <div>
            <label class="block text-sm font-medium">Ville</label>
            <input type="text" name="city" required
                   class="w-full border rounded p-2">
        </div>

        <div>
            <label class="block text-sm font-medium">Quartier</label>
            <input type="text" name="quartier" required
                   class="w-full border rounded p-2">
        </div>

        <button type="submit"
                class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700 w-full">
            Enregistrer le contact
        </button>
    </form>

</div>
{% endblock %}
