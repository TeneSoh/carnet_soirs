{% load static tailwind_tags %}

<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="./assets/css/output.css" rel="stylesheet">
  <link rel="stylesheet" href="./assets/fontawesome/css/all.css">
  {% tailwind_css %}
  
</head>

<body>
    <main class="flex items-center justify-center bg-gradient-to-r from-gray-50 to-gray-200 h-screen font-poppins">

        <form action="" id="formLoginPage" method="POST" 
            class="flex  shadow-2xl rounded-2xl w-[35%] min-h-[60%] relative overflow-hidden transition-all  duration-2000 ease-linear"
        >
        {% csrf_token %}

            <div class="custom-shape-divider-bottom-1765470033   absolute top-0 left-0 w-full overflow-hidden">
                <svg data-name="Layer 1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" preserveAspectRatio="none">
                    <path d="M321.39,56.44c58-10.79,114.16-30.13,172-41.86,82.39-16.72,168.19-17.73,250.45-.39C823.78,31,906.67,72,985.66,92.83c70.05,18.48,146.53,26.09,214.34,3V0H0V27.35A600.21,600.21,0,0,0,321.39,56.44Z" class="relative block  fill-black"></path>
                </svg>
            </div>


            <div class="p-16 w-full">
                <div class=" flex flex-col items-start w-full  justify-center">
                    <h1 class="font-bold text-3xl text-right">S'enregistrer <span class="text-xl">🥳</span></h1>
                    <p class="text-sm text-gray-700 my-5">Bienvenue ! S'il vous plait entrez vos informations</p>
                    <div class="flex flex-col w-full mt-5">
                        <label class="text-[13px] font-bold mb-1.5" for="">Nom</label>
                        <input type="text" class="h-10 border-2 bg-gray-50 text-xs border-gray-300 rounded-md w-full " name="name" placeholder="Entrer votre nom">
                    </div>

                    <div class="flex flex-col w-full mt-5">
                        <label class="text-[13px] font-bold mb-1.5" for="">Email</label>
                        <input type="text" class="h-10 border-2 bg-gray-50 text-xs border-gray-300 rounded-md w-full " name="email" placeholder="Entrer votre email">

                    </div>
                    <div class="flex flex-col w-full mt-5">
                        <label class="text-[13px] font-bold mb-1.5" for="">Mot de passe</label>
                        <input type="password" class="h-10 border-2 bg-gray-50 text-xs border-gray-300  rounded-md w-full " name="password" placeholder="Entrer votre mot de passe">
                    </div>
                    <div class="flex flex-col w-full mt-5">
                        <label class="text-[13px] font-bold mb-1.5" for="">confirmer le mot de passe</label>
                        <input type="password" class="h-10 border-2 bg-gray-50 text-xs border-gray-300  rounded-md w-full " name="confpassword" placeholder="confirmer votre mot de passe">
                    </div>

                    <button class="bg-black mt-8 h-10 font-bold hover:bg-gray-800 text-white text-sm rounded-md w-full" type="submit">
                        Register
                    </button>
                
                
                </div>
                <p class="text-[13px] flex justify-center  mt-5 text-black text-center">Vous avez deja un compte ? 
                    <a href="{% url 'login'%}" class="font-bold ml-1 hover:underline"> Se connecter</a></p>
            </div>
        </form>

    </main>

</body>
</html>
